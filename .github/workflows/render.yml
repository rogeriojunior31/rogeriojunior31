name: render profile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, assets/**, .github/workflows/render.yml]

permissions:
  contents: write

concurrency: render

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/generate.py
        env:
          # PROFILE_TOKEN (classic PAT, read:user) is optional; it guarantees private contributions are counted
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add header.svg projects.svg activity.svg README.md
          git diff --cached --quiet || { git commit -m "chore: render profile" && git push; }
