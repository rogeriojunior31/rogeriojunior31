  <rect x="0" y="462" width="860" height="18" rx="0" ry="8" fill="#1f2335" class="bar"/>

  <text x="12" y="469" font-size="10" class="bar">
    <tspan fill="#7aa2f7" font-weight="bold">rogeriojunior31</tspan>
    <tspan fill="#3b4261"> │ </tspan>
    <tspan fill="#e0af68">g</tspan><tspan fill="#565f89"> GitHub </tspan>
    <tspan fill="#e0af68">l</tspan><tspan fill="#565f89"> LinkedIn </tspan>
    <tspan fill="#e0af68">m</tspan><tspan fill="#565f89"> Mail </tspan>
    <tspan fill="#e0af68">k</tspan><tspan fill="#565f89"> Kaggle </tspan>
    <tspan fill="#e0af68">s</tspan><tspan fill="#565f89"> Steam </tspan>
    <tspan fill="#e0af68">r</tspan><tspan fill="#565f89"> Retro</tspan>
