  <!-- ============ STATUS BAR — Row 1: Mode ribbons ============ -->
  <rect x="0" y="414" width="860" height="18" fill="#16161e" class="bar"/>

  <!-- NORMAL mode (active — green) -->
  <rect x="6" y="416" width="68" height="14" rx="2" ry="2" fill="#9ece6a" opacity="0.2" class="bar"/>
  <text x="12" y="427" font-size="9.5" fill="#9ece6a" font-weight="bold" class="bar">NORMAL</text>
  <text x="76" y="427" font-size="10" fill="#9ece6a" class="bar"></text>

  <!-- PANE mode -->
  <rect x="88" y="416" width="70" height="14" rx="2" ry="2" fill="#16161e" class="bar"/>
  <text x="94" y="427" font-size="9.5" fill="#565f89" class="bar">PANE</text>

  <!-- TAB mode -->
