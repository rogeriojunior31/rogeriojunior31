      <tspan fill="#565f89">~</tspan>
      <tspan fill="#9ece6a"> ❯ </tspan>
      <tspan fill="#a9b1d6" class="cursor">▌</tspan>
    </text>
  </g>

  <!-- ============ RIGHT PANE: Tech Stack ============ -->

  <!-- Languages -->
  <g class="d2">
    <text x="458" y="68" font-size="10.5">
      <tspan fill="#bb9af7" font-weight="bold">  Languages</tspan>
    </text>
  </g>
  <g class="d3">
    <text x="458" y="86" font-size="10.5">
      <tspan fill="#3b4261">  ├─ </tspan><tspan fill="#e0af68">JavaScript</tspan>
      <tspan fill="#3b4261"> · </tspan><tspan fill="#7aa2f7">TypeScript</tspan>
    </text>
  </g>
  <g class="d4">
    <text x="458" y="102" font-size="10.5">
      <tspan fill="#3b4261">  ├─ </tspan><tspan fill="#9ece6a">Python</tspan>
      <tspan fill="#3b4261"> · </tspan><tspan fill="#7dcfff">Go</tspan>
    </text>
  </g>
  <g class="d5">
    <text x="458" y="118" font-size="10.5">
      <tspan fill="#3b4261">  └─ </tspan><tspan fill="#c0caf5">Shell / Bash</tspan>
    </text>
  </g>

  <!-- Platforms -->
  <g class="d6">
    <text x="458" y="146" font-size="10.5">
      <tspan fill="#bb9af7" font-weight="bold">  Platforms &amp; Runtime</tspan>
    </text>
  </g>
  <g class="d7">
    <text x="458" y="164" font-size="10.5">
      <tspan fill="#3b4261">  ├─ </tspan><tspan fill="#a9b1d6">Node.js</tspan>
      <tspan fill="#3b4261"> · </tspan><tspan fill="#a9b1d6">Bun</tspan>
      <tspan fill="#3b4261"> · </tspan><tspan fill="#a9b1d6">NestJS</tspan>
    </text>
  </g>
  <g class="d8">
    <text x="458" y="180" font-size="10.5">
      <tspan fill="#3b4261">  └─ </tspan><tspan fill="#a9b1d6">Docker</tspan>
    </text>
  </g>

  <!-- Cloud -->
