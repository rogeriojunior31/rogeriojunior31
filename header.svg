  <text x="456" y="427" font-size="9.5" fill="#565f89" class="bar">SESSION</text>

  <!-- ============ STATUS BAR — Row 2: Tips / Shortcuts ============ -->
  <rect x="0" y="432" width="860" height="18" fill="#16161e" class="bar"/>

  <text x="12" y="444" font-size="9.5" class="bar">
    <tspan fill="#565f89">Tip:</tspan>
    <tspan fill="#e0af68"> Alt+n</tspan><tspan fill="#565f89"> New pane</tspan>
    <tspan fill="#3b4261"> │ </tspan>
    <tspan fill="#e0af68">Alt+←→</tspan><tspan fill="#565f89"> Switch</tspan>
    <tspan fill="#3b4261"> │ </tspan>
    <tspan fill="#e0af68">Alt+f</tspan><tspan fill="#565f89"> Fullscreen</tspan>
    <tspan fill="#3b4261"> │ </tspan>
    <tspan fill="#e0af68">Ctrl+p x</tspan><tspan fill="#565f89"> Close</tspan>
  </text>

  <!-- ============ BOTTOM INFO BAR ============ -->
