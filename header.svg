      <tspan fill="#3b4261"> · </tspan><tspan fill="#a9b1d6">LlamaIndex</tspan>
    </text>
  </g>
  <g class="d14">
    <text x="458" y="304" font-size="10.5">
      <tspan fill="#3b4261">  └─ </tspan><tspan fill="#a9b1d6">PyTorch</tspan>
      <tspan fill="#3b4261"> · </tspan><tspan fill="#a9b1d6">Fine-Tuning</tspan>
    </text>
  </g>

  <!-- Databases -->
